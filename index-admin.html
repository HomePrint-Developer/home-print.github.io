<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Konfigurasi Tailwind untuk mendeteksi class 'dark' secara manual
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .modal-active {
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        /* Transisi smooth untuk perpindahan tema */
        body * {
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 400ms;
        }

        /* Hilangkan transisi untuk modal agar responsif instan saat pop-up */
        #modalBackdrop *,
        #toolsBackdrop * {
            transition-property: none;
        }
    </style>
</head>

    <!-- Script Logika Modal Tools -->
    <script>
        const toolsModal = document.getElementById('toolsModal');
        const toolsBackdrop = document.getElementById('toolsBackdrop');
        const toolsContent = document.getElementById('toolsContent');
        const btnOpenToolsModal = document.getElementById('btnOpenToolsModal');
        const btnCloseToolsModal = document.getElementById('btnCloseToolsModal');

        btnOpenToolsModal.addEventListener('click', (e) => {
            e.stopPropagation();
            toolsModal.classList.remove('hidden');
            toolsModal.classList.add('flex');
            setTimeout(() => {
                toolsBackdrop.classList.remove('opacity-0');
                toolsContent.classList.add('modal-active');
            }, 10);
        });

        function closeToolsModal() {
            toolsBackdrop.classList.add('opacity-0');
            toolsContent.classList.remove('modal-active');
            setTimeout(() => {
                toolsModal.classList.add('hidden');
                toolsModal.classList.remove('flex');
            }, 300);
        }

        btnCloseToolsModal.addEventListener('click', closeToolsModal);
        toolsBackdrop.addEventListener('click', closeToolsModal);

        document.getElementById('toolsForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const halamanTujuan = document.querySelector('input[name="toolsOpt"]:checked').value;
            window.location.href = halamanTujuan;
        });
    </script>

            const actionBtn = document.getElementById('mainActionButton');

            if (tabName === 'stok') {
                tabStok.className = "flex-1 text-xs sm:text-sm font-extrabold py-3.5 px-2 rounded-xl transition-all duration-300 bg-cyan-500 dark:bg-white/10 text-white shadow-md dark:shadow-lg tracking-wide flex items-center justify-center gap-1.5";
                tabKertas.className = "flex-1 text-xs sm:text-sm font-extrabold py-3.5 px-2 rounded-xl transition-all duration-300 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-transparent tracking-wide flex items-center justify-center gap-1.5";
                panelStok.classList.remove('hidden');
                panelKertas.classList.add('hidden');
                actionBtn.innerText = "Tambah Stok Barang";
            } else {
                tabKertas.className = "flex-1 text-xs sm:text-sm font-extrabold py-3.5 px-2 rounded-xl transition-all duration-300 bg-cyan-500 dark:bg-white/10 text-white shadow-md dark:shadow-lg tracking-wide flex items-center justify-center gap-1.5";
                tabStok.className = "flex-1 text-xs sm:text-sm font-extrabold py-3.5 px-2 rounded-xl transition-all duration-300 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-transparent tracking-wide flex items-center justify-center gap-1.5";
                panelKertas.classList.remove('hidden');
                panelStok.classList.add('hidden');
                actionBtn.innerText = "Tambah Varian Kertas Foto";
            }
        };

        // Modal Logic
        window.tambahDataAction = () => {
            const backdrop = document.getElementById('modalBackdrop');
            backdrop.classList.remove('hidden');

            if (activeTab === 'stok') {
                document.getElementById('modalStokBox').classList.remove('hidden');
                document.getElementById('modalKertasBox').classList.add('hidden');
            } else {
                document.getElementById('modalKertasBox').classList.remove('hidden');
                document.getElementById('modalStokBox').classList.add('hidden');
            }
        };

        window.closeModal = () => {
            document.getElementById('modalBackdrop').classList.add('hidden');
            document.getElementById('formAddStok').reset();
            document.getElementById('formAddKertas').reset();

            document.getElementById('notifStok').classList.add('hidden');
            document.getElementById('notifKertas').classList.add('hidden');
        };

        // Form Submit: Tambah Stok
        document.getElementById('formAddStok').addEventListener('submit', async (e) => {
            e.preventDefault();
            const namaInput = document.getElementById('inputNamaStok').value.trim();
            const stokInput = document.getElementById('inputSisaStok').value;
            const hargaInput = document.getElementById('inputHargaStok').value;
            const notif = document.getElementById('notifStok');
            const btn = document.getElementById('btnSimpanStok');

            notif.classList.add("hidden");
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            try {
                const snapshot = await get(child(ref(db), 'stok'));
                let nextIndex = 1;
                if (snapshot.exists()) {
                    const keys = Object.keys(snapshot.val());
                    keys.forEach(key => {
                        if (key.startsWith('barang')) {
                            const num = parseInt(key.replace('barang', ''));
                            if (!isNaN(num) && num >= nextIndex) nextIndex = num + 1;
                        }
                    });
                }
                await set(ref(db, 'stok/barang' + nextIndex), {
                    nama_stok: namaInput,
                    sisa_stok: parseInt(stokInput),
                    harga: parseInt(hargaInput)
                });

                notif.innerText = `Stok berhasil ditambahkan!`;
                notif.className = "mb-4 p-3 text-xs rounded-xl border bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20 font-semibold tracking-wide block";
                document.getElementById('formAddStok').reset();
                setTimeout(() => closeModal(), 1500);
            } catch (error) {
                notif.innerText = 'Gagal menyimpan: ' + error.message;
                notif.className = "mb-4 p-3 text-xs rounded-xl border bg-red-50 text-red-600 border-red-200 dark:bg-red-500/10 dark:text-red-400 dark:border-red-500/20 font-semibold tracking-wide block";
            } finally {
                btn.disabled = false;
                btn.innerText = 'Simpan Data Stok';
            }
        });

        // Form Submit: Tambah Kertas Foto
        document.getElementById('formAddKertas').addEventListener('submit', async (e) => {
            e.preventDefault();
            const namaKertasBaru = document.getElementById('inputNamaKertas').value.trim();
            const notif = document.getElementById('notifKertas');
            const btn = document.getElementById('btnSimpanKertas');

            if (!namaKertasBaru) return;

            notif.classList.add("hidden");
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            try {
                let maxIndex = 0;
                listKertasExisting.forEach(key => {
                    const match = key.match(/\d+/);
                    if (match) {
                        const num = parseInt(match[0]);
                        if (num > maxIndex) maxIndex = num;
                    }
                });
                const nextIndex = maxIndex + 1;
                const nodeName = `paper${nextIndex}`;

                await set(ref(db, `foto_paper/${nodeName}`), {
                    nama_paper: namaKertasBaru
                });

                notif.innerText = `Varian berhasil ditambahkan!`;
                notif.className = "mb-4 p-3 text-xs rounded-xl border bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20 font-semibold tracking-wide block";
                document.getElementById('formAddKertas').reset();
                setTimeout(() => closeModal(), 1500);
            } catch (error) {
                notif.innerText = 'Gagal menyimpan: ' + error.message;
                notif.className = "mb-4 p-3 text-xs rounded-xl border bg-red-50 text-red-600 border-red-200 dark:bg-red-500/10 dark:text-red-400 dark:border-red-500/20 font-semibold tracking-wide block";
            } finally {
                btn.disabled = false;
                btn.innerText = 'Simpan Kertas Foto';
            }
        });

        // Read & Load Data Stok
        const stokRef = ref(db, 'stok');
        onValue(stokRef, (snapshot) => {
            const tbody = document.getElementById('stokTableBody');
            tbody.innerHTML = '';
            if (snapshot.exists()) {
                const data = snapshot.val();
                let index = 1;
                for (let id in data) {
                    const item = data[id];
                    const row = `
                        <tr onclick="toggleActionRow('stok-${id}')" class="border-b border-slate-200 dark:border-white/5 hover:bg-slate-50 dark:hover:bg-white/5 transition cursor-pointer">
                            <td class="p-3 sm:p-4 text-xs font-semibold text-slate-500 dark:text-slate-400 text-center">${index++}</td>
                            <td class="p-3 sm:p-4 text-xs sm:text-sm font-bold text-slate-800 dark:text-white break-words">${item.nama_stok}</td>
                            <td class="p-3 sm:p-4 text-xs sm:text-sm text-center"><span class="bg-cyan-50 dark:bg-cyan-500/10 text-cyan-700 dark:text-cyan-400 px-2 sm:px-3 py-1 rounded-lg border border-cyan-200 dark:border-cyan-500/20">${item.sisa_stok}</span></td>
                            <td class="p-3 sm:p-4 text-xs sm:text-sm text-slate-700 dark:text-slate-300 font-bold truncate">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</td>
                        </tr>
                        <tr id="action-stok-${id}" class="hidden bg-slate-100 dark:bg-white/5 border-b border-slate-300 dark:border-white/5 animate-fadeIn">
                            <td colspan="4" class="p-3 text-right">
                                <div class="flex justify-end gap-2 sm:gap-3 px-1">
                                    <button onclick="event.stopPropagation(); updateStok('${id}', '${item.nama_stok}', ${item.sisa_stok}, ${item.harga})" class="bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-300 dark:border-amber-500/20 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-amber-100 dark:hover:bg-amber-500/20 transition">Ubah</button>
                                    <button onclick="event.stopPropagation(); deleteStok('${id}')" class="bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 border border-red-300 dark:border-red-500/20 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-100 dark:hover:bg-red-500/20 transition">Hapus</button>
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                }
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-slate-500 dark:text-slate-400 font-medium">Belum ada data stok barang.</td></tr>';
            }
        });

        // Read & Load Data Kertas Foto
        const kertasRef = ref(db, 'foto_paper');
        onValue(kertasRef, (snapshot) => {
            const tbody = document.getElementById('kertasTableBody');
            tbody.innerHTML = '';
            listKertasExisting = [];
            if (snapshot.exists()) {
                const data = snapshot.val();
                let index = 1;
                listKertasExisting = Object.keys(data);
                for (let paperId in data) {
                    const item = data[paperId];
                    const row = `
                        <tr onclick="toggleActionRow('kertas-${paperId}')" class="border-b border-slate-200 dark:border-white/5 hover:bg-slate-50 dark:hover:bg-white/5 transition cursor-pointer">
                            <td class="p-4 text-xs font-semibold text-slate-500 dark:text-slate-400 text-center w-16">${index++}</td>
                            <td class="p-4 text-sm font-bold text-slate-800 dark:text-white flex justify-between">${item.nama_paper}</td>
                        </tr>
                        <tr id="action-kertas-${paperId}" class="hidden bg-slate-100 dark:bg-white/5 border-b border-slate-300 dark:border-white/5 animate-fadeIn">
                            <td colspan="2" class="p-3 text-right">
                                <button onclick="event.stopPropagation(); updateKertas('${paperId}', '${item.nama_paper}')" class="bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-300 dark:border-amber-200/50 px-3 py-1.5 rounded-lg text-xs font-bold mx-2 hover:bg-amber-100 dark:hover:bg-amber-500/20 transition">Ubah</button>
                                <button onclick="event.stopPropagation(); deleteKertas('${paperId}')" class="bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 border border-red-300 dark:border-red-200/50 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-100 dark:hover:bg-red-500/20 transition">Hapus</button>
                            </td>
                        </tr>`;
                    tbody.innerHTML += row;
                }
            } else {
                tbody.innerHTML = '<tr><td colspan="2" class="p-10 text-center text-slate-500 dark:text-slate-400 font-medium">Belum ada varian kertas foto.</td></tr>';
            }
        });

        // Toggle Actions
        window.toggleActionRow = (customId) => {
            const targetRow = document.getElementById(`action-${customId}`);
            document.querySelectorAll('[id^="action-"]').forEach(row => {
                if (row.id !== `action-${customId}`) row.classList.add('hidden');
            });
            targetRow.classList.toggle('hidden');
        };

        // Edit/Hapus Stok
        window.deleteStok = (id) => {
            if (confirm("Apakah Anda yakin ingin menghapus barang ini dari database?")) {
                remove(ref(db, 'stok/' + id)).then(() => alert("Barang sukses terhapus!"));
            }
        };

        window.updateStok = (id, currentNama, currentStok, currentHarga) => {
            const newNama = prompt("Edit Nama Barang:", currentNama); if (newNama === null) return;
            const newStok = prompt("Edit Sisa Stok:", currentStok); if (newStok === null) return;
            const newHarga = prompt("Edit Harga (angka saja):", currentHarga); if (newHarga === null) return;
            const updates = {};
            updates['stok/' + id] = { nama_stok: newNama.trim(), sisa_stok: parseInt(newStok), harga: parseInt(newHarga) };
            update(ref(db), updates).then(() => alert("Data barang diperbarui!"));
        };

        // Edit/Hapus Kertas
        window.deleteKertas = (paperId) => {
            if (confirm(`Apakah Anda yakin ingin menghapus varian kertas ${paperId}?`)) {
                remove(ref(db, 'foto_paper/' + paperId)).then(() => alert("Kertas foto berhasil dihapus!"));
            }
        };

        window.updateKertas = (paperId, currentNamaPaper) => {
            const newNamaPaper = prompt("Edit Nama Jenis Kertas Foto:", currentNamaPaper);
            if (!newNamaPaper || newNamaPaper.trim() === "") return;
            const updates = {};
            updates[`foto_paper/${paperId}`] = { nama_paper: newNamaPaper.trim() };
            update(ref(db), updates).then(() => alert("Varian kertas foto diperbarui!"));
        };

        // Logout
        window.logout = () => {
            if (confirm("Apakah Anda yakin ingin keluar dari halaman dasbor?")) {
                sessionStorage.removeItem('isLoggedIn');
                window.location.href = "index.html";
            }
        };
    </script>
</body>

</html>
