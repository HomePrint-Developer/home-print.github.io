<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="ic-transparent.png" type="image/png">
    <title>Admin Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Konfigurasi Tailwind untuk mendeteksi class 'dark' secara manual
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .modal-active {
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        /* Transisi smooth untuk perpindahan tema */
        body * {
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 400ms;
        }
    </style>
</head>

<body
    class="bg-slate-50 dark:bg-slate-900 font-sans min-h-screen flex flex-col items-center p-4 sm:p-6 relative overflow-x-hidden transition-colors duration-500">

    <!-- Script Pengecekan Tema Langsung Agar Tidak Kedip -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Background Ornaments -->
    <div
        class="absolute w-80 h-80 rounded-full bg-indigo-400/20 dark:bg-indigo-500/10 blur-[100px] top-10 left-10 pointer-events-none">
    </div>
    <div
        class="absolute w-80 h-80 rounded-full bg-pink-400/20 dark:bg-pink-500/10 blur-[100px] bottom-10 right-10 pointer-events-none">
    </div>

    <div
        class="max-w-2xl w-full bg-white/70 dark:bg-white/[0.06] backdrop-blur-xl rounded-[32px] shadow-[0_20px_40px_-15px_rgba(0,0,0,0.05)] dark:shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] p-5 sm:p-8 border border-white dark:border-white/10 relative z-10 text-slate-900 dark:text-white my-6">

        <div
            class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 dark:border-white/10 pb-4 gap-4">
            <div class="flex-1">
                <div class="flex items-center justify-between w-full">
                    <h2
                        class="text-2xl font-black tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                        Manajemen
                        <span
                            class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 via-pink-500 to-yellow-500 dark:from-cyan-400 dark:via-pink-400 dark:to-yellow-400">
                            Kritik & Saran
                        </span>
                    </h2>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    Pantau dan kelola kritik serta saran.
                </p>
            </div>
            <a href="index-admin.html"
                class="text-xs font-bold text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-white dark:bg-white/5 hover:bg-slate-100 dark:hover:bg-white/10 border border-slate-300 dark:border-white/10 px-4 py-2 rounded-xl transition text-center sm:self-center shadow-sm dark:shadow-none transform active:scale-95">
                Kembali
            </a>
        </div>

        <div id="adminNotif"
            class="hidden mb-4 p-3 text-sm rounded-xl border font-semibold tracking-wide shadow-sm animate-fadeIn">
        </div>

        <div id="loadingState" class="py-12 text-center text-slate-500 dark:text-slate-400 font-medium">
            <svg class="animate-spin h-6 w-6 text-cyan-500 dark:text-cyan-400 mx-auto mb-2"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            Memuat data masukan...
        </div>

        <div id="feedbackListContainer" class="space-y-3.5 hidden"></div>

        <div id="paginationContainer"
            class="mt-8 pt-4 border-t border-slate-200 dark:border-white/10 flex flex-col sm:flex-row items-center justify-between gap-4 hidden">
            <span id="pageInfo" class="text-xs font-bold text-slate-500 dark:text-slate-400 tracking-wide uppercase">
                Halaman 1 dari 1
            </span>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button id="btnPrev" disabled
                    class="flex-1 sm:flex-none text-xs font-bold px-4 py-2.5 bg-white dark:bg-white/5 border border-slate-300 dark:border-white/10 disabled:opacity-50 dark:disabled:opacity-30 disabled:hover:bg-white dark:disabled:hover:bg-white/5 disabled:cursor-not-allowed rounded-xl hover:bg-slate-50 dark:hover:bg-white/10 transition text-slate-700 dark:text-slate-300 shadow-sm dark:shadow-none">
                    Previous
                </button>
                <button id="btnNext" disabled
                    class="flex-1 sm:flex-none text-xs font-bold px-4 py-2.5 bg-white dark:bg-white/5 border border-slate-300 dark:border-white/10 disabled:opacity-50 dark:disabled:opacity-30 disabled:hover:bg-white dark:disabled:hover:bg-white/5 disabled:cursor-not-allowed rounded-xl hover:bg-slate-50 dark:hover:bg-white/10 transition text-slate-700 dark:text-slate-300 shadow-sm dark:shadow-none">
                    Next
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL EDIT FEEDBACK -->
    <div id="editModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div id="editBackdrop"
            class="absolute inset-0 bg-slate-900/30 dark:bg-slate-900/60 backdrop-blur-md transition-opacity duration-300 opacity-0">
        </div>
        <div id="editContent"
            class="max-w-md w-full bg-white/95 dark:bg-slate-900/90 backdrop-blur-2xl rounded-[32px] shadow-[0_20px_40px_rgba(0,0,0,0.1)] dark:shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8)] p-6 sm:p-8 relative border border-white dark:border-white/10 transform scale-95 opacity-0 transition-all duration-300">
            <button id="btnCloseEditModal"
                class="absolute top-5 right-5 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors p-1 bg-slate-100 dark:bg-white/5 rounded-full hover:bg-slate-200 dark:hover:bg-white/10">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="mb-6 border-b border-slate-200 dark:border-white/10 pb-4 pr-6">
                <h2 class="text-xl font-black text-slate-900 dark:text-white tracking-tight">Edit Feedback</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Perbarui masukan dari pelanggan ini.</p>
            </div>

            <form id="editForm" class="space-y-5">
                <div>
                    <label
                        class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">
                        Nama Lengkap
                    </label>
                    <input type="text" id="editNama" required
                        class="w-full px-4 py-3 bg-slate-50 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all text-sm font-medium text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 shadow-inner dark:shadow-none">
                </div>
                <div>
                    <label
                        class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">
                        Pesan & Masukan
                    </label>
                    <textarea id="editPesan" required rows="4"
                        class="w-full px-4 py-3 bg-slate-50 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all text-sm font-medium text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 resize-none shadow-inner dark:shadow-none"></textarea>
                </div>
                <button type="submit" id="btnSimpanEdit"
                    class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 hover:brightness-110 text-white font-black py-3.5 px-4 rounded-xl mt-6 text-center transform active:scale-[0.97] transition-all duration-200 text-sm tracking-wide shadow-lg flex items-center justify-center">
                    Simpan Perubahan
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            alert('Akses ditolak! Silakan login terlebih dahulu.');
            window.location.href = "index.html";
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBO_jWfltM8J9obdA5Vio50kPtOqkDuDlw",
            authDomain: "home-print-8437d.firebaseapp.com",
            databaseURL: "https://home-print-8437d-default-rtdb.firebaseio.com",
            projectId: "home-print-8437d",
            storageBucket: "home-print-8437d.firebasestorage.app",
            messagingSenderId: "418956397903",
            appId: "1:418956397903:web:cb17eaeab729790f23093a",
            measurementId: "G-ZHRM0PKS2D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const navigationEntry = performance.getEntriesByType("navigation")[0];
        if (navigationEntry && navigationEntry.type === "reload") {
            window.location.href = "index-admin.html";
        }

        let allFeedbackArray = [];
        let activeFeedbackKey = null;
        let currentPage = 1;
        const itemsPerPage = 10;
        let isMasked = false;
        let editingFeedbackId = null;

        function maskName(str) {
            if (!str) return 'Anonim';
            return str.split(' ').map(word => {
                if (word.length <= 1) return word;
                return word[0] + '*'.repeat(word.length - 1);
            }).join(' ');
        }

        function hitungWaktuMundur(timestampMilis) {
            if (!timestampMilis) return '';
            const sekarang = Date.now();
            const selisihDetik = Math.floor((sekarang - timestampMilis) / 1000);

            if (selisihDetik < 30) return "Baru saja";
            if (selisihDetik < 60) return `${selisihDetik} detik yang lalu`;
            const selisihMenit = Math.floor(selisihDetik / 60);
            if (selisihMenit < 60) return `${selisihMenit} menit yang lalu`;
            const selisihJam = Math.floor(selisihMenit / 60);
            if (selisihJam < 24) return `${selisihJam} jam yang lalu`;
            const selisihHari = Math.floor(selisihJam / 24);
            if (selisihHari < 7) return `${selisihHari} hari yang lalu`;
            if (selisihHari < 30) {
                const selisihMinggu = Math.floor(selisihHari / 7);
                return `${selisihMinggu} minggu yang lalu`;
            }
            const dateObj = new Date(timestampMilis);
            return `${dateObj.getDate()} - ${dateObj.getMonth() + 1} - ${dateObj.getFullYear()}`;
        }

        function startRealtimeListener() {
            const listContainer = document.getElementById('feedbackListContainer');
            const pagContainer = document.getElementById('paginationContainer');
            const loadingState = document.getElementById('loadingState');

            onValue(ref(db, 'feedback'), (snapshot) => {
                allFeedbackArray = [];

                if (snapshot.exists()) {
                    const dataRaw = snapshot.val();
                    Object.keys(dataRaw).forEach(key => {
                        const item = { id: key, ...dataRaw[key] };
                        allFeedbackArray.push(item);
                    });

                    allFeedbackArray.sort((a, b) => {
                        const timeA = a.timestamp || 0;
                        const timeB = b.timestamp || 0;
                        if (timeA !== timeB) return timeB - timeA;
                        const numA = parseInt(a.id.replace('feedback', '')) || 0;
                        const numB = parseInt(b.id.replace('feedback', '')) || 0;
                        return numB - numA;
                    });
                }

                loadingState.classList.add('hidden');

                if (allFeedbackArray.length === 0) {
                    listContainer.innerHTML = `<div class="py-10 text-center text-slate-500 dark:text-slate-400 font-medium text-sm">Belum ada kritik atau saran yang masuk.</div>`;
                    listContainer.classList.remove('hidden');
                    pagContainer.classList.add('hidden');
                } else {
                    listContainer.classList.remove('hidden');
                    pagContainer.classList.remove('hidden');
                    renderPage(currentPage);
                }
            }, (error) => {
                console.error("Fetch Error: ", error);
                loadingState.innerHTML = `<div class="text-red-500 dark:text-red-400 font-semibold text-sm">Gagal memuat data: ${error.message}</div>`;
            });
        }

        function renderPage(page) {
            const listContainer = document.getElementById('feedbackListContainer');
            listContainer.innerHTML = '';

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, allFeedbackArray.length);
            const totalPages = Math.ceil(allFeedbackArray.length / itemsPerPage);
            const pageItems = allFeedbackArray.slice(startIndex, endIndex);

            pageItems.forEach(item => {
                const isSelected = (activeFeedbackKey === item.id);
                const rowDiv = document.createElement('div');

                rowDiv.className = `p-4 rounded-2xl border transition-all duration-200 cursor-pointer flex flex-col gap-3 ${isSelected
                    ? 'bg-indigo-50 dark:bg-indigo-500/10 border-indigo-300 dark:border-indigo-500/40 shadow-[0_4px_20px_rgba(99,102,241,0.05)] dark:shadow-[0_4px_20px_rgba(99,102,241,0.15)]'
                    : 'bg-white/80 dark:bg-white/[0.03] border-slate-200 dark:border-white/5 hover:border-slate-300 dark:hover:border-white/20 hover:bg-slate-50 dark:hover:bg-white/[0.05] shadow-sm dark:shadow-none'
                    }`;

                rowDiv.addEventListener('click', () => {
                    activeFeedbackKey = (activeFeedbackKey === item.id) ? null : item.id;
                    renderPage(currentPage);
                });

                const contentWrapper = document.createElement('div');
                contentWrapper.className = "w-full flex flex-col gap-1.5";

                const headerWrapper = document.createElement('div');
                headerWrapper.className = "flex items-center justify-between w-full";

                const nameDiv = document.createElement('div');
                nameDiv.className = "text-sm font-bold text-slate-800 dark:text-slate-200 tracking-wide truncate";
                const namaAsli = item.nama || 'Anonim';
                nameDiv.textContent = isMasked ? maskName(namaAsli) : namaAsli;

                const timeStr = hitungWaktuMundur(item.timestamp);
                const timeDiv = document.createElement('div');
                timeDiv.className = "text-[10px] text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap pl-2";
                timeDiv.innerText = timeStr;

                headerWrapper.appendChild(nameDiv);
                if (timeStr) headerWrapper.appendChild(timeDiv);

                const messageDiv = document.createElement('div');
                messageDiv.className = "text-xs text-slate-600 dark:text-slate-400 italic break-words leading-relaxed pl-1";
                messageDiv.textContent = `"${item.pesan || ''}"`;

                contentWrapper.appendChild(headerWrapper);
                contentWrapper.appendChild(messageDiv);
                rowDiv.appendChild(contentWrapper);

                if (isSelected) {
                    const actionContainer = document.createElement('div');
                    actionContainer.className = "flex gap-2 w-full pt-3 mt-1 border-t border-indigo-200 dark:border-indigo-500/20 animate-fadeIn justify-end";

                    const editBtn = document.createElement('button');
                    editBtn.className = "text-xs font-black bg-gradient-to-r from-blue-500 to-cyan-600 hover:brightness-110 text-white px-5 py-2.5 rounded-xl border border-blue-400/20 shadow-md shadow-blue-500/20 dark:shadow-blue-500/10 transition transform active:scale-95";
                    editBtn.innerText = "Edit";
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openEditModal(item.id, item.nama, item.pesan);
                    });

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = "text-xs font-black bg-gradient-to-r from-red-500 to-pink-600 hover:brightness-110 text-white px-5 py-2.5 rounded-xl border border-red-400/20 shadow-md shadow-red-500/20 dark:shadow-red-500/10 transition transform active:scale-95";
                    deleteBtn.innerText = "Hapus";
                    deleteBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (confirm(`Hapus masukan dari ${item.nama}?`)) {
                            await deleteFeedback(item.id);
                        }
                    });

                    actionContainer.appendChild(editBtn);
                    actionContainer.appendChild(deleteBtn);
                    rowDiv.appendChild(actionContainer);
                }
                listContainer.appendChild(rowDiv);
            });

            document.getElementById('pageInfo').innerText = `Halaman ${page} dari ${totalPages}`;
            document.getElementById('btnPrev').disabled = (page === 1);
            document.getElementById('btnNext').disabled = (page === totalPages || totalPages === 0);
        }

        async function deleteFeedback(nodeKey) {
            const notif = document.getElementById('adminNotif');
            try {
                await remove(ref(db, `feedback/${nodeKey}`));
                notif.innerText = `Data berhasil dihapus dari sistem!`;
                notif.className = "mb-4 p-3 text-xs sm:text-sm rounded-xl border bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-300 dark:border-emerald-500/20 font-semibold tracking-wide shadow-sm block animate-fadeIn";

                activeFeedbackKey = null;
                setTimeout(() => { notif.classList.add('hidden'); }, 3000);
            } catch (error) {
                console.error("Delete Error: ", error);
                notif.innerText = `Gagal menghapus data: ${error.message}`;
                notif.className = "mb-4 p-3 text-xs sm:text-sm rounded-xl border bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 border-red-300 dark:border-red-500/20 font-semibold tracking-wide shadow-sm block animate-fadeIn";
            }
        }

        // --- SISTEM MODAL EDIT ---
        const editModal = document.getElementById('editModal');
        const editBackdrop = document.getElementById('editBackdrop');
        const editContent = document.getElementById('editContent');
        const btnCloseEditModal = document.getElementById('btnCloseEditModal');
        const editForm = document.getElementById('editForm');

        function openEditModal(id, nama, pesan) {
            editingFeedbackId = id;
            document.getElementById('editNama').value = nama || '';
            document.getElementById('editPesan').value = pesan || '';

            editModal.classList.remove('hidden');
            editModal.classList.add('flex');
            setTimeout(() => {
                editBackdrop.classList.remove('opacity-0');
                editContent.classList.add('modal-active');
            }, 10);
        }

        function closeEditModal() {
            editBackdrop.classList.add('opacity-0');
            editContent.classList.remove('modal-active');
            setTimeout(() => {
                editModal.classList.add('hidden');
                editModal.classList.remove('flex');
                editingFeedbackId = null;
            }, 300);
        }

        btnCloseEditModal.addEventListener('click', closeEditModal);
        editBackdrop.addEventListener('click', closeEditModal);

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSimpan = document.getElementById('btnSimpanEdit');
            const notif = document.getElementById('adminNotif');

            btnSimpan.disabled = true;
            btnSimpan.innerText = 'Menyimpan...';

            const newNama = document.getElementById('editNama').value.trim();
            const newPesan = document.getElementById('editPesan').value.trim();

            try {
                await update(ref(db, `feedback/${editingFeedbackId}`), {
                    nama: newNama,
                    pesan: newPesan
                });

                closeEditModal();
                notif.innerText = `Data berhasil diperbarui!`;
                notif.className = "mb-4 p-3 text-xs sm:text-sm rounded-xl border bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-300 dark:border-emerald-500/20 font-semibold tracking-wide shadow-sm block animate-fadeIn";
                setTimeout(() => { notif.classList.add('hidden'); }, 3000);
            } catch (error) {
                console.error("Update Error: ", error);
                alert("Gagal memperbarui data: " + error.message);
            } finally {
                btnSimpan.disabled = false;
                btnSimpan.innerText = 'Simpan Perubahan';
            }
        });

        document.getElementById('btnPrev').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                activeFeedbackKey = null;
                renderPage(currentPage);
            }
        });

        document.getElementById('btnNext').addEventListener('click', () => {
            const totalPages = Math.ceil(allFeedbackArray.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                activeFeedbackKey = null;
                renderPage(currentPage);
            }
        });

        setInterval(() => {
            if (allFeedbackArray.length > 0) renderPage(currentPage);
        }, 60000);

        window.addEventListener('DOMContentLoaded', () => {
            startRealtimeListener();
        });
    </script>
</body>

</html>
